name: Build AndroidHarness zh-CN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zhcn/**'
      - '.github/workflows/zhcn-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install required NDK
        run: '${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"'
      - name: Apply Chinese localization patch
        run: python3 zhcn/apply_zhcn.py --root . --report zhcn/report.json
      - name: Test translation script
        run: python3 -m unittest discover -s zhcn -p 'test_*.py'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Chinese APK and translation report
        uses: actions/upload-artifact@v4
        with:
          name: AndroidHarness-zhCN-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            zhcn/report.json
          if-no-files-found: error
